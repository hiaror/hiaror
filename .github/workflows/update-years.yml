name: Update experience years

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Calculate years and update README
        run: |
          START_YEAR=2014
          START_MONTH=4
          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%-m)
          YEARS=$(( CURRENT_YEAR - START_YEAR ))
          if [ $CURRENT_MONTH -lt $START_MONTH ]; then
            YEARS=$(( YEARS - 1 ))
          fi
          YEARS_PLUS="${YEARS}+"

          # Update the About Me bullet
          sed -i "s/ecosystem for [0-9]*+ years/ecosystem for ${YEARS_PLUS} years/" README.md

          # Update the typing SVG line - matches literal + separators and %7C pipe encoding
          sed -i "s/Consultant+%7C+[0-9]*%2B+Years/Consultant+%7C+${YEARS}%2B+Years/" README.md

          echo "Updated to ${YEARS_PLUS} years"
          grep "Microsoft ecosystem" README.md
          grep "Consultant" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" || (git add README.md && git commit -m "Update experience years to $(date +%Y)" && git push)
