name: Update experience years

on:
  schedule:
    - cron: '0 0 1 * *'  # runs on the 1st of every month
  workflow_dispatch:      # allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate years and update README
        run: |
          START_YEAR=2014
          START_MONTH=4
          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%-m)
          YEARS=$(( CURRENT_YEAR - START_YEAR ))
          if [ $CURRENT_MONTH -lt $START_MONTH ]; then
            YEARS=$(( YEARS - 1 ))
          fi
          YEARS_PLUS="${YEARS}+"

          # Update the About Me bullet
          sed -i "s/- 🏢 [0-9]*+ years in the Microsoft ecosystem/- 🏢 ${YEARS_PLUS} years in the Microsoft ecosystem/" README.md

          # Update the typing SVG line
          sed -i "s/Microsoft%2B365%2BConsultant%2B%257C%2B[0-9]*%252B%2BYears%2Bin%2Bthe%2BMicrosoft%2BEcosystem/Microsoft+365+Consultant+%7C+${YEARS}%2B+Years+in+the+Microsoft+Ecosystem/" README.md

          echo "Updated to ${YEARS_PLUS} years"
          cat README.md | grep "Microsoft ecosystem"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" || (git add README.md && git commit -m "Update experience years to $(date +%Y)" && git push)
